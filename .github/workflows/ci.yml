name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: 后端（ruff + 体量门禁 + pytest）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: 安装依赖
        run: pip install -r tools/dev-requirements.txt -r server/requirements.txt
      - name: Lint（ruff）
        run: ruff check .
      - name: 体量门禁
        run: python scripts/size_gate.py
      - name: 后端与工具测试
        run: pytest tests server/tests -q

  frontend:
    name: 前端（vitest + 类型检查构建）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: 安装依赖
        run: npm ci
      - name: 单元测试
        run: npm test
      - name: 构建（含 tsc 类型检查）
        run: npm run build
